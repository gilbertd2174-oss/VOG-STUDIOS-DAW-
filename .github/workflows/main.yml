name: Build VOG Studio
on: [workflow_dispatch, push]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - run: cmake --build build --config Release --parallel 2
      - name: Archive Mac app bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "build/VOGStudio_artefacts/Release/VOG Studio.app" VOG_Studio_macOS.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: VOG_Studio_macOS
          path: VOG_Studio_macOS.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: VOG_Studio_Windows_x64
          path: build/VOGStudio_artefacts/Release/VOG Studio.exe
          if-no-files-found: error
